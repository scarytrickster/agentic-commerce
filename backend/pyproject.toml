[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain>=1.4.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.12",
    "openai>=3.19.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "qdrant-client[fastembed]>=1.19.1",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
